<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МЕКСИКА</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            background: linear-gradient(135deg, #111111, #222222);
            background-size: cover;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 50px;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header a {
            color: #ffffff;
            text-decoration: none;
            opacity: 0.8;
        }

        .header a:hover {
            opacity: 1;
        }

        .country-title {
            font-size: 32px;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 30px;
        }

        .city-card {
            width: 100%;
            max-width: 350px;
        }

        .city-image {
            width: 345px;
            height: 345px;
            background-color: #1a1a1a;
            border-radius: 12px;
            margin: 0 auto 15px auto;
            background-size: cover;
            background-position: center;
            border: 1px solid #333;
        }

        .city-name {
            font-size: 20px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .back-link {
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            color: #ffffff;
            opacity: 0.8;
            margin-top: 10px;
        }

        .back-link:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html">ГЛАВНАЯ</a>
        <a href="friends.html">ОБЩЕНИЕ</a>
    </div>

    <div class="country-title">МЕКСИКА</div>

    <a href="cancun_details.html" style="text-decoration: none; color: inherit; display: inline-block;">
        <div class="city-card">
            <div class="city-image" style="background-image: url('images/cities/ka.webp');"></div>
            <div class="city-name">КАНКУН</div>
        </div>
    </a>

    <a href="friends.html" class="back-link">НАЗАД</a>
</body>
</html>
