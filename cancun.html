<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мексика - Канкун</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .header {
            margin-bottom: 20px;
        }
        .header a, .back-link {
            margin-right: 15px;
            text-decoration: none;
            color: #0066cc;
            font-weight: bold;
        }
        .country-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .city-card {
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 300px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            transition: transform 0.2s;
        }
        .city-card:hover {
            transform: translateY(-3px);
        }
        .city-image {
            width: 100%;
            height: 180px;
            background-color: #e0e0e0; /* Место под вашу картинку */
        }
        .city-name {
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="header">
    <a href="index.html">ГЛАВНАЯ</a>
    <a href="friends.html">СТРАНЫ</a>
</div>

<div class="country-title">МЕКСИКА</div>

<a href="cancun_details.html" style="display: block; text-decoration: none; color: inherit;">
    <div class="city-card">
        <div class="city-image"></div>
        <div class="city-name">КАНКУН</div>
    </div>
</a>

<a href="friends.html" class="back-link">НАЗАД</a>

</body>
</html>
