<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хельсинки - Детали</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
        }
        .nav {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 20px;
            margin-bottom: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            flex-wrap: wrap;
        }
        .nav span {
            color: #888;
            text-transform: uppercase;
        }
        .nav span.active, .nav span:hover {
            color: #fff;
            border-bottom: 2px solid #fff;
            padding-bottom: 3px;
        }
        .page-title {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 50px;
            text-transform: uppercase;
        }
        .grid {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            max-width: 1150px;
            margin: 0 auto;
        }
        .card {
            background: #161616;
            border-radius: 12px;
            overflow: hidden;
            width: 347px;
            text-align: center;
            padding-bottom: 20px;
        }
        .card img {
            width: 347px;
            height: 347px;
            object-fit: cover;
            display: block;
        }
        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin: 15px 0 6px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .card-desc {
            font-size: 13px;
            color: #aaa;
            padding: 0 15px;
            text-transform: uppercase;
        }
        .back-link {
            display: inline-block;
            margin-top: 50px;
            color: #888;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
        }
        .back-link:hover {
            color: #fff;
        }

        /* Адаптивность для телефонов: по две карточки в ряд, третья по центру снизу */
        @media (max-width: 768px) {
            .page-title {
                font-size: 26px;
                margin-bottom: 30px;
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
                max-width: 100%;
                padding: 0 10px;
            }
            .card {
                width: 100%;
                padding-bottom: 15px;
            }
            .card img {
                width: 100%;
                height: auto;
                aspect-ratio: 1 / 1;
            }
            .card:nth-child(3) {
                grid-column: span 2;
                max-width: 65%;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

    <div class="nav" id="nav">
        <span class="active" onclick="show('ЕДА')">ЕДА</span>
        <span onclick="show('КРЕПКОЕ')">КРЕПКОЕ</span>
        <span onclick="show('ПИВО')">ПИВО</span>
        <span onclick="show('НАПИТКИ')">НАПИТКИ</span>
        <span onclick="show('МЕСТА')">МЕСТА</span>
    </div>

    <div class="page-title" id="pageTitle">ХЕЛЬСИНКИ</div>

    <div class="grid" id="grid"></div>

    <div>
        <a href="index.html" class="back-link">&#8592; НАЗАД К СТРАНАМ</a>
    </div>

    <script>
        const baseFolder = 'images';
        const content = {
            'ЕДА': { folder: 'food', title: 'ХЕЛЬСИНКИ', items: [
                { title: 'ЛОХИКЕЙТТО', desc: 'Сливочный рыбный суп', img: 'lohikeitto.webp' },
                { title: 'КАЛАКУККО', desc: 'Рыба в хлебе', img: 'kalakukko.webp' },
                { title: 'ПОРОНКАРИСТУС', desc: 'Тушеная оленина', img: 'poronkaristus.webp' }
            ]},
            'КРЕПКОЕ': { folder: 'strong', title: 'КРЕПКОЕ', items: [
                { title: 'FINLANDIA', desc: 'Финская чистая водка', img: 'finlandia.webp' },
                { title: 'KOSKENKORVA', desc: 'Традиционный крепкий напиток', img: 'koskenkorva.webp' },
                { title: 'GUSTAV', desc: 'Крафтовый северный дистиллят', img: 'gustav.webp' }
            ]},
            'ПИВО': { folder: 'beer', title: 'ПИВО', items: [
                { title: 'KOFF', desc: 'Классическое финское пиво', img: 'beer1.webp' },
                { title: 'KARHU', desc: 'Крепкое светлое пиво', img: 'beer2.webp' },
                { title: 'LAPIN KULTA', desc: 'Северное арктическое пиво', img: 'beer3.webp' }
            ]},
            'НАПИТКИ': { folder: 'drinks', title: 'НАПИТКИ', items: [
                { title: 'MULLOJÄÄ', desc: 'Финский ягодный морс', img: 'drink1.webp' },
                { title: 'MEHU', desc: 'Натуральный лесной сок', img: 'drink2.webp' },
                { title: 'KVASSI', desc: 'Традиционный северный квас', img: 'drink3.webp' }
            ]},
            'МЕСТА': { folder: 'locations', title: 'МЕСТА', items: [
                { title: 'СЕНАТСКАЯ ПЛОЩАДЬ', desc: 'Главный архитектурный ансамбль', img: 'loc1.webp' },
                { title: 'ХЕЛЬСИНКСКИЙ СОБОР', desc: 'Символ столицы Финляндии', img: 'loc2.webp' },
                { title: 'РЫНОЧНАЯ ПЛОЩАДЬ', desc: 'Исторический центр у порта', img: 'loc3.webp' }
            ]}
        };

        const categories = ['ЕДА', 'КРЕПКОЕ', 'ПИВО', 'НАПИТКИ', 'МЕСТА'];
        let currentIndex = 0;

        function show(categoryKey) {
            currentIndex = categories.indexOf(categoryKey);
            if (currentIndex === -1) currentIndex = 0;

            document.querySelectorAll('.nav span').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav span').forEach(span => {
                if (span.textContent === categoryKey) {
                    span.classList.add('active');
                }
            });

            const categoryData = content[categoryKey];
            document.getElementById('pageTitle').textContent = categoryData.title;

            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            categoryData.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${baseFolder}/${categoryData.folder}/${item.img}" alt="${item.title}">
                    <div class="card-title">${item.title}</div>
                    <div class="card-desc">${item.desc}</div>
                `;
                grid.appendChild(card);
            });
        }

        // Поддержка свайпов на телефоне (влево / вправо)
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, false);

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, false);

        function handleSwipe() {
            const threshold = 50; 
            if (touchEndX + threshold < touchStartX) {
                currentIndex = (currentIndex + 1) % categories.length;
                show(categories[currentIndex]);
            } else if (touchEndX > touchStartX + threshold) {
                currentIndex = (currentIndex - 1 + categories.length) % categories.length;
                show(categories[currentIndex]);
            }
        }

        window.onload = () => {
            show('ЕДА');
        };
    </script>
</body>
</html>
