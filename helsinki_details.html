<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ХЕЛЬСИНКИ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }
        .nav {
            margin-bottom: 20px;
        }
        .nav span {
            cursor: pointer;
            margin: 0 10px;
            font-weight: bold;
            color: #555;
            user-select: none;
        }
        .nav span.active {
            color: #000;
            text-decoration: underline;
        }
        .city-card {
            display: inline-block;
        }
        .city-image {
            background-size: cover;
            background-position: center;
            border-radius: 12px;
            margin: 0 auto 15px auto;
        }
        .city-name {
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 250px;
        }
        .card .card-img {
            width: 100%;
            height: 180px;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
        }
        .card-title {
            font-weight: bold;
            margin-top: 10px;
            font-size: 16px;
        }
        .card-desc {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="nav" id="nav">
        <span class="active" onclick="show('ЕДА')">ЕДА</span>
        <span onclick="show('КРЕПКОЕ')">КРЕПКОЕ</span>
        <span onclick="show('ПИВО')">ПИВО</span>
        <span onclick="show('НАПИТКИ')">НАПИТКИ</span>
        <span onclick="show('МЕСТА')">МЕСТА</span>
    </div>

    <!-- Крупная квадратная фотография Хельсинки (ссылка ведет на главную страницу городов или список, а не сама на себя) -->
    <a href="countries.html" style="text-decoration: none; color: inherit; display: inline-block;">
        <div class="city-card">
            <div class="city-image" style="background-image: url('images/cities/hel.webp'); width: 345px; height: 345px;"></div>
            <div class="city-name">ХЕЛЬСИНКИ</div>
        </div>
    </a>

    <!-- Контейнер, куда скрипт динамически выводит карточки выбранной категории -->
    <div class="grid" id="grid"></div>

    <script>
        const baseFolder = 'images';
        const content = {
            'ЕДА': { folder: 'food', items: [
                { title: 'ЛОХИКЕЙТТО', desc: 'Сливочный рыбный суп', img: 'lohikeitto.webp' },
                { title: 'КАЛАКУККО', desc: 'Рыба в хлебе', img: 'kalakukko.webp' },
                { title: 'ПОРОНКАРИСТУС', desc: 'Тушеная оленина', img: 'poronkaristus.webp' }
            ]},
            'КРЕПКОЕ': { folder: 'strong', items: [
                { title: 'FINLANDIA', desc: 'Финская чистая водка', img: 'finlandia.webp' },
                { title: 'KOSKENKORVA', desc: 'Традиционный крепкий напиток', img: 'koskenkorva.webp' },
                { title: 'GUSTAV', desc: 'Северный крафтовый дистиллят', img: 'gustav.webp' }
            ]},
            'ПИВО': { folder: 'beer', items: [
                { title: 'KARHU', desc: 'Мощный хвойный лагерь', img: 'karhu.webp' },
                { title: 'KOFF', desc: 'Столичный золотистый напиток', img: 'koff.webp' },
                { title: 'LAPIN KULTA', desc: 'Арктическое хмельное золото', img: 'lapin_kulta.webp' }
            ]},
            'НАПИТКИ': { folder: 'drinks', items: [
                { title: 'LONKERO', desc: 'Освежающий джин-коктейль', img: 'lonkero.webp' },
                { title: 'SAHTI', desc: 'Крепкий финский эль', img: 'sahti.webp' },
                { title: 'GLÖGG', desc: 'Пряный горячий напиток', img: 'glogg.webp' }
            ]},
            'МЕСТА': { folder: 'locations', items: [
                { title: 'МЕСТО 1', desc: 'Главная достопримечательность', img: 'loc1.webp' },
                { title: 'МЕСТО 2', desc: 'Исторический центр', img: 'loc2.webp' },
                { title: 'МЕСТО 3', desc: 'Живописная набережная', img: 'loc3.webp' }
            ]}
        };

        function show(category) {
            // Переключаем класс active у кнопок навигации
            const spans = document.querySelectorAll('.nav span');
            spans.forEach(span => {
                if (span.textContent === category) {
                    span.classList.add('active');
                } else {
                    span.classList.remove('active');
                }
            });

            // Очищаем сетку и заполняем карточками выбранной категории
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            const catData = content[category];
            if (!catData) return;

            catData.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img" style="background-image: url('${baseFolder}/${catData.folder}/${item.img}')"></div>
                    <div class="card-title">${item.title}</div>
                    <div class="card-desc">${item.desc}</div>
                `;
                grid.appendChild(card);
            });
        }

        // Запускаем отображение ЕДЫ сразу при загрузке страницы
        window.onload = function() {
            show('ЕДА');
        };
    </script>
</body>
</html>
