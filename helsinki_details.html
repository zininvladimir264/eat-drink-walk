<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хельсинки - Детали</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .nav {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .nav span {
            color: #888888;
            text-transform: uppercase;
        }
        .nav span.active, .nav span:hover {
            color: #ffffff;
            border-bottom: 2px solid #ffffff;
            padding-bottom: 3px;
        }
        h1 {
            font-size: 32px;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }
        .grid {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #111111;
            border-radius: 12px;
            overflow: hidden;
            width: 300px;
            text-align: center;
            padding-bottom: 20px;
        }
        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0 8px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .card-desc {
            font-size: 13px;
            color: #aaaaaa;
            padding: 0 15px;
        }
        .back-link {
            display: inline-block;
            margin-top: 50px;
            color: #888888;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
        }
        .back-link:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="nav" id="nav">
        <span class="active" onclick="show('ЕДА')">ЕДА</span>
        <span onclick="show('КРЕПКОЕ')">КРЕПКОЕ</span>
        <span onclick="show('ПИВО')">ПИВО</span>
        <span onclick="show('НАПИТКИ')">НАПИТКИ</span>
        <span onclick="show('МЕСТА')">МЕСТА</span>
    </div>

    <h1 id="title">ХЕЛЬСИНКИ</h1>

    <div class="grid" id="grid"></div>

    <div>
        <a href="index.html" class="back-link">&#8592; НАЗАД К СТРАНАМ</a>
    </div>

    <script>
        const baseFolder = 'images';
        const content = {
            'ЕДА': { folder: 'food', items: [
                { title: 'ЛОХИКЕЙТТО', desc: 'Сливочный рыбный суп', img: 'lohikeitto.webp' },
                { title: 'КАЛАКУККО', desc: 'Рыба в хлебе', img: 'kalakukko.webp' },
                { title: 'ПОРОНКАРИСТУС', desc: 'Тушеная оленина', img: 'poronkaristus.webp' }
            ]},
            'КРЕПКОЕ': { folder: 'strong', items: [
                { title: 'FINLANDIA', desc: 'Финская чистая водка', img: 'finlandia.webp' },
                { title: 'KOSKENKORVA', desc: 'Традиционный крепкий напиток', img: 'koskenkorva.webp' },
                { title: 'GUSTAV', desc: 'Крафтовый северный дистиллят', img: 'gustav.webp' }
            ]},
            'ПИВО': { folder: 'beer', items: [
                { title: 'KOFF', desc: 'Классическое финское пиво', img: 'beer1.webp' },
                { title: 'KARHU', desc: 'Крепкое светлое пиво', img: 'beer2.webp' },
                { title: 'LAPIN KULTA', desc: 'Северное арктическое пиво', img: 'beer3.webp' }
            ]},
            'НАПИТКИ': { folder: 'drinks', items: [
                { title: 'MULLOJÄÄ', desc: 'Финский ягодный морс', img: 'drink1.webp' },
                { title: 'MEHU', desc: 'Натуральный лесной сок', img: 'drink2.webp' },
                { title: 'KVASSI', desc: 'Традиционный северный квас', img: 'drink3.webp' }
            ]},
            'МЕСТА': { folder: 'locations', items: [
                { title: 'СЕНАТСКАЯ ПЛОЩАДЬ', desc: 'Главный архитектурный ансамбль', img: 'loc1.webp' },
                { title: 'ХЕЛЬСИНКСКИЙ СОБОР', desc: 'Символ столицы Финляндии', img: 'loc2.webp' },
                { title: 'РЫНОЧНАЯ ПЛОЩАДЬ', desc: 'Исторический центр у порта', img: 'loc3.webp' }
            ]}
        };

        function show(category) {
            document.querySelectorAll('.nav span').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');

            document.getElementById('title').innerText = category;

            const section = content[category];
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            section.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${baseFolder}/${section.folder}/${item.img}" alt="${item.title}">
                    <div class="card-title">${item.title}</div>
                    <div class="card-desc">${item.desc}</div>
                `;
                grid.appendChild(card);
            });
        }

        window.onload = () => {
            show('ЕДА');
        };
    </script>
</body>
</html>
