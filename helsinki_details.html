<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хельсинки - Детали</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
        }
        .nav {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 20px;
            margin-bottom: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            flex-wrap: wrap;
        }
        .nav span {
            color: #888;
            text-transform: uppercase;
        }
        .nav span.active, .nav span:hover {
            color: #fff;
        }
        .page-title {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 50px;
            text-transform: uppercase;
        }
        .grid {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
        }
        /* Общий блок-контейнер для элемента меню */
        .menu-item-wrapper {
            display: flex;
            flex-direction: column;
            width: 365px;
            margin-bottom: 20px;
        }
        /* Карточка с картинкой */
        .card {
            width: 100%;
            height: 365px;
            overflow: hidden;
            border-radius: 12px;
            background: #161616;
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* Блок с текстом строго под карточкой */
        .card-content {
            padding: 10px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin-top: 8px;
            margin-bottom: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .card-desc {
            font-size: 13px;
            color: #aaa;
            text-transform: uppercase;
        }
        .back-link {
            display: inline-block;
            margin-top: 50px;
            color: #888;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
        }
        .back-link:hover {
            color: #fff;
        }
        /* Адаптивность для телефонов */
        @media (max-width: 768px) {
            .page-title {
                font-size: 26px;
                margin-bottom: 30px;
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
                max-width: 100%;
                padding: 0 10px;
            }
            .menu-item-wrapper {
                width: 100%;
            }
            .card {
                width: 100%;
                height: auto;
                aspect-ratio: 1 / 1;
            }
            .card img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .card:nth-child(3) {
                grid-column: 1;
            }
        }
    </style>
</head>
<body>

    <div class="nav" id="nav">
        <span class="active" onclick="show('ЕДА')">ЕДА</span>
        <span onclick="show('КРЕПКОЕ')">КРЕПКОЕ</span>
        <span onclick="show('ПИВО')">ПИВО</span>
        <span onclick="show('НАПИТКИ')">НАПИТКИ</span>
        <span onclick="show('МЕСТА')">МЕСТА</span>
    </div>

    <div class="page-title" id="pageTitle">ХЕЛЬСИНКИ</div>
    <div class="grid" id="grid"></div>

    <div>
        <a href="index.html" class="back-link">&#8592; НАЗАД К СТРАНИЦЕ</a>
    </div>

    <script>
        const baseFolder = 'images';
        const content = {
            'ЕДА': { folder: 'food', title: 'ХЕЛЬСИНКИ', items: [
                { title: 'ЛОХИКЕЙТТО', desc: 'СЛИВОЧНЫЙ РЫБНЫЙ СУП', img: 'lohikeitto.jpg' },
                { title: 'КАЛАКУККО', desc: 'РЫБА В ХЛЕБЕ', img: 'kalakukko.jpg' },
                { title: 'ПОРОНКАРИСТУС', desc: 'ТУШЕНАЯ ОЛЕНИНА', img: 'poronkaristus.jpg' }
            ]},
            'КРЕПКОЕ': { folder: 'strong', title: 'КРЕПКОЕ', items: [
                { title: 'FINLANDIA', desc: 'ФИНСКАЯ ЧИСТАЯ ВОДКА', img: 'finlandia.jpg' },
                { title: 'KOSKENKORVA', desc: 'ТРАДИЦИОННЫЙ КРЕПКИЙ НАПИТОК', img: 'koskenkorva.jpg' },
                { title: 'GUSTAV', desc: 'КРАФТОВЫЙ СЕВЕРНЫЙ ДИСТИЛЛЯТ', img: 'gustav.jpg' }
            ]},
            'ПИВО': { folder: 'beer', title: 'ПИВО', items: [
                { title: 'KOFF', desc: 'КЛАССИЧЕСКОЕ ФИНСКОЕ ПИВО', img: 'koff.jpg' },
                { title: 'KARHU', desc: 'КРЕПКОЕ СВЕТЛОЕ ПИВО', img: 'karhu.jpg' },
                { title: 'LAPIN KULTA', desc: 'СЕВЕРНОЕ АРКТИЧЕСКОЕ ПИВО', img: 'lapinkulta.jpg' }
            ]},
            'НАПИТКИ': { folder: 'drinks', title: 'НАПИТКИ', items: [
                { title: 'MULLOJÄÄ', desc: 'ФИНСКИЙ ЯГОДНЫЙ МОРС', img: 'mullojaa.jpg' },
                { title: 'MEHU', desc: 'НАТУРАЛЬНЫЙ ЛЕСНОЙ СОК', img: 'mehu.jpg' },
                { title: 'KVASSI', desc: 'ТРАДИЦИОННЫЙ СЕВЕРНЫЙ КВАС', img: 'kvassi.jpg' }
            ]},
            'МЕСТА': { folder: 'locations', title: 'МЕСТА', items: [
                { title: 'СЕНАТСКАЯ ПЛОЩАДЬ', desc: 'ГЛАВНЫЙ АРХИТЕКТУРНЫЙ АНСАМБЛЬ', img: 'senate.jpg' },
                { title: 'ХЕЛЬСИНКСКИЙ СОБОР', desc: 'СИМВОЛ СТОЛИЦЫ', img: 'cathedral.jpg' },
                { title: 'РЫНОЧНАЯ ПЛОЩАДЬ', desc: 'ИСТОРИЧЕСКИЙ ЦЕНТР', img: 'market.jpg' }
            ]}
        };

        const categories = ['ЕДА', 'КРЕПКОЕ', 'ПИВО', 'НАПИТКИ', 'МЕСТА'];
        let currentIndex = 0;

        function show(categoryKey) {
            currentIndex = categories.indexOf(categoryKey);
            if (currentIndex === -1) currentIndex = 0;

            document.querySelectorAll('.nav span').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav span').forEach(span => {
                if (span.textContent === categoryKey) {
                    span.classList.add('active');
                }
            });

            const categoryData = content[categoryKey];
            document.getElementById('pageTitle').textContent = categoryData.title;

            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            categoryData.items.forEach(item => {
                // Создаем единый контейнер для карточки и текста, чтобы они не разваливались
                const wrapper = document.createElement('div');
                wrapper.className = 'menu-item-wrapper';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${baseFolder}/${categoryData.folder}/${item.img}">
                `;
                wrapper.appendChild(card);

                const infoDiv = document.createElement('div');
                infoDiv.className = 'card-content';
                infoDiv.innerHTML = `
                    <div class="card-title">${item.title}</div>
                    <div class="card-desc">${item.desc}</div>
                `;
                wrapper.appendChild(infoDiv);

                grid.appendChild(wrapper);
            });
        }

        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, false);

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, false);

        function handleSwipe() {
            const threshold = 50;
            if (touchEndX + threshold < touchStartX) {
                currentIndex = (currentIndex + 1) % categories.length;
                show(categories[currentIndex]);
            } else if (touchEndX > touchStartX + threshold) {
                currentIndex = (currentIndex - 1 + categories.length) % categories.length;
                show(categories[currentIndex]);
            }
        }

        window.onload = () => {
            show('ЕДА');
        };
    </script>
</body>
</html>
