<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>

            color: #aaa;

        function show(categoryKey) {

                    span.classList.remove('active');

* **Сброс или перезагрузка страницы (автообновление):** Если у вас настроен автозапуск скрипта (`window.onload`) или в редакторе/браузере включено автоматическое обновление страницы при изменении файлов (Live Reload), то при сохранении файла страница мгновенно перезагружается. Если в коде в этот момент есть синтаксическая ошибка (например, пропущена запятая, кавычка или скобка в JavaScript), скрипт аварийно завершается или вообще не отрабатывает, из-за чего элементы (например, названия пива, напитков или мест) исчезают или выводятся некорректно.
* **Проблемы с кэшем браузера:** Иногда браузер подтягивает старую версию файла из памяти. В результате код меняется, но отображается старый вариант верстки.
* **Ошибки в консоли браузера:** Если в коде JavaScript (в объекте `content`) допущена опечатка, скрипт останавливает выполнение на середине. Из-за этого часть разделов (например, «ПИВО», «НАПИТКИ», «МЕСТА») просто не успевает отрисоваться, и на экране остаются только пустые блоки или старые данные.

Чтобы этого избежать, рекомендуется проверять код на наличие пропущенных запятых и кавычек в массивах данных, а также принудительно обновлять страницу в браузере комбинацией клавиш `Ctrl + F5` (или `Cmd + Shift + R` на Mac), чтобы сбросить кэш.
